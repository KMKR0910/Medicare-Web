            let slideIndex = 0;
            showSlides();
    
            function showSlides() {
                let i;
                let slides = document.getElementsByClassName("slides");
                for (i = 0; i < slides.length; i++) {
                    slides[i].style.display = "none";  // Hide all images
                }
                slideIndex++;
                if (slideIndex > slides.length) {slideIndex = 1} // Reset to first image
                slides[slideIndex - 1].style.display = "block";  // Show current image
                setTimeout(showSlides, 5000); // Change image every 4 seconds
            }
