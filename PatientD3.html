            <script>
                // Function to get query parameter from URL
                function getQueryParameter(name) {
                    const urlParams = new URLSearchParams(window.location.search);
                    return urlParams.get(name);
                }

                // Get appointment details and display them
                const appNum = getQueryParameter('app_num');
                const patientName = getQueryParameter('patient_name');
                const conta = getQueryParameter('conta');
                const appDate = getQueryParameter('app_date');
                const appTime = getQueryParameter('app_time');

                if (appNum) {
                    document.getElementById('message').textContent = "Your appointment number is: " + appNum;
                }

                if (patientName && conta && appDate && appTime) {
                    document.getElementById('details').innerHTML = `
                        <p><strong>Patient Name:</strong> ${patientName}</p>
                        <p><strong>Contact Number:</strong> ${conta}</p>
                        <p><strong>Appointment Date:</strong> ${appDate}</p>
                        <p><strong>Appointment Time:</strong> ${appTime}</p>
                    `;
                }

                // Get error message if present
                const errorMessage = getQueryParameter('error_message');
                if (errorMessage) {
                    document.getElementById('message').textContent = errorMessage;
                }

                // Load bookings function
                function loadBookings(customerId) {
                    fetch(`fetch_bookings.php?customer_id=${customerId}`)
                        .then(response => response.json())
                        .then(data => {
                            const bookingList = document.getElementById('bookingList');
                            bookingList.innerHTML = '';

                            data.forEach(booking => {
                                const li = document.createElement('li');
                                li.textContent = `Booking ID: ${booking.id}, Date: ${booking.date}, Details: ${booking.details}`; // Adjust according to your columns
                                bookingList.appendChild(li);
                            });
                        })
                        .catch(error => console.error('Error fetching bookings:', error));
                }

                window.onload = function() {
                    const customerId = "CUSTOMER_ID_HERE"; // Replace this with actual customer ID logic
                    loadBookings(customerId);
                };
            </script>
