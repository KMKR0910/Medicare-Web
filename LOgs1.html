<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(140deg, #737DFE, #FFCAC9);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            text-align: left;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4887f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #356ac9;
        }

        .register-redirect {
            margin-top: 20px;
        }

        .register-redirect a {
            color: #4887f3;
            text-decoration: none;
        }

        .register-redirect a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Supplier Login</h1>
        <form action="SuppLog.php" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="Email_Address" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="Password" required>

            <button type="submit">Log In</button>
        </form>
        <div class="register-redirect">
            <p>Not registered yet? <a href="fProject2.html">Register here</a></p>
        </div>
    </div>
</body>
</html>
