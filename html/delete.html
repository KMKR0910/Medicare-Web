    <script>
        // Fetch appointment details when an ID is selected
        function fetchAppointmentDetails() {
            const id = document.getElementById('id').value; // Get the selected appointment ID
            if (!id) return; // Ensure an ID is selected

            fetch('fetch_appointment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'app_num=' + encodeURIComponent(id) // Pass the selected ID
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    // Populate form fields with appointment details
                    document.getElementById('patient_name').value = data.patient_name;
                    document.getElementById('conta').value = data.conta;
                    document.getElementById('app_date').value = data.app_date;
                    document.getElementById('app_time').value = data.app_time;
                }
            })
            .catch(error => console.error('Error fetching appointment:', error));
        }
    </script>
