    <div class="main--content">

                <span>Primary</span>
                <h2>Dashboard</h2>
                <h3>Name</h3>
            </div>
        </div>

        <!-- Appointment Information Section -->
        <fieldset class="confirm">
            <h1 class="head">Appointment Information</h1>
            <div id="message"></div>
            <div id="details"></div>
        </fieldset>
    </div>

    <!-- Script to handle appointment details -->
    <script>
        // Function to get query parameter from URL
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Get appointment details and display them
        const appNum = getQueryParameter('app_num');
        const patientName = getQueryParameter('patient_name');
        const conta = getQueryParameter('conta');
        const appDate = getQueryParameter('app_date');
        const appTime = getQueryParameter('app_time');
        
        if (appNum) {
            document.getElementById('message').textContent = "Your appointment number is: " + appNum;
        }
        
        if (patientName && conta && appDate && appTime) {
            document.getElementById('details').innerHTML = `
                <p><strong>Patient Name:</strong> ${patientName}</p>
                <p><strong>Contact Number:</strong> ${conta}</p>
                <p><strong>Appointment Date:</strong> ${appDate}</p>
                <p><strong>Appointment Time:</strong> ${appTime}</p>
            `;
        }
        
        // Get error message if present
        const errorMessage = getQueryParameter('error_message');
        if (errorMessage) {
            document.getElementById('message').textContent = errorMessage;
        }
    </script>
